<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Your Password | SalarySeed</title>
  <meta name="description" content="Request a password reset link for your SalarySeed account.">
  <link rel="canonical" href="https://salaryseed.in/auth/forgot-password.html">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/env.js"></script>
</head>
<body>
  <a href="#main-content" class="skip-to-content">Skip to main content</a>

  <header class="site-header">
    <div class="container nav-container">
      <a href="/" class="brand-logo" aria-label="SalarySeed Homepage">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
        </svg>
        <span>SalarySeed</span>
      </a>
      <nav class="main-nav">
        <a href="/" class="nav-link">Home</a>
      </nav>
      <div class="nav-auth-group">
        <a href="/auth/login.html" class="btn btn-outline btn-sm">Sign In</a>
      </div>
    </div>
  </header>

  <main id="main-content" class="auth-wrapper">
    <div class="auth-card">
      <h1 class="auth-title">Forgot Password</h1>
      <p class="auth-subtitle">Enter your registered email to receive a recovery link</p>

      <div id="auth-alert" class="alert alert-danger" style="display: none;" role="alert"></div>
      <div id="auth-success" class="alert alert-success" style="display: none;" role="alert"></div>

      <form id="form-forgot" novalidate>
        <div class="form-group">
          <label for="reset-email" class="form-label">Email Address</label>
          <input type="email" id="reset-email" class="form-input" placeholder="you@example.com" required autocomplete="email">
        </div>

        <button type="submit" id="btn-submit-forgot" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
          Send Recovery Link
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--color-text-muted);">
        Remembered your password? <a href="/auth/login.html" style="color: var(--color-accent-dark); font-weight: 600; text-decoration: none;">Back to Sign In</a>
      </div>
    </div>
  </main>

  <script type="module">
    import { getSupabase } from '/js/supabase-client.js';
    import { isSupabaseConfigured } from '/js/config.js';

    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('form-forgot');
      const emailInput = document.getElementById('reset-email');
      const submitBtn = document.getElementById('btn-submit-forgot');
      const alertBox = document.getElementById('auth-alert');
      const successBox = document.getElementById('auth-success');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        alertBox.style.display = 'none';
        successBox.style.display = 'none';

        const email = emailInput.value.trim();
        if (!email) {
          alertBox.textContent = 'Please enter your registered email address.';
          alertBox.style.display = 'block';
          return;
        }

        if (!isSupabaseConfigured()) {
          alertBox.innerHTML = '<strong>Configuration Notice:</strong> Supabase credentials are not configured in <code>js/config.js</code> or <code>.env</code>.';
          alertBox.style.display = 'block';
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Sending link...';

        try {
          const supabase = await getSupabase();
          const redirectUrl = `${window.location.origin}/auth/reset-password.html`;

          const { error } = await supabase.auth.resetPasswordForEmail(email, {
            redirectTo: redirectUrl
          });

          if (error) {
            alertBox.textContent = error.message || 'Unable to process reset request.';
            alertBox.style.display = 'block';
            submitBtn.disabled = false;
            submitBtn.textContent = 'Send Recovery Link';
            return;
          }

          successBox.innerHTML = `
            <strong>Reset Link Dispatched:</strong><br>
            If an account exists for <strong>${email}</strong>, a password reset link has been dispatched to your inbox.
          `;
          successBox.style.display = 'block';
          form.reset();
          submitBtn.disabled = false;
          submitBtn.textContent = 'Send Recovery Link';

        } catch (err) {
          alertBox.textContent = 'An error occurred. Please check connection and try again.';
          alertBox.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Send Recovery Link';
        }
      });
    });
  </script>
</body>
</html>
