<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password | SalarySeed</title>
  <meta name="description" content="Set a new password for your SalarySeed account.">
  <link rel="canonical" href="https://salaryseed.in/auth/reset-password.html">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <a href="#main-content" class="skip-to-content">Skip to main content</a>

  <header class="site-header">
    <div class="container nav-container">
      <a href="/" class="brand-logo" aria-label="SalarySeed Homepage">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
        </svg>
        <span>SalarySeed</span>
      </a>
    </div>
  </header>

  <main id="main-content" class="auth-wrapper">
    <div class="auth-card">
      <h1 class="auth-title">Set New Password</h1>
      <p class="auth-subtitle">Enter your new secure password below</p>

      <div id="auth-alert" class="alert alert-danger" style="display: none;" role="alert"></div>
      <div id="auth-success" class="alert alert-success" style="display: none;" role="alert"></div>

      <form id="form-reset" novalidate>
        <div class="form-group">
          <label for="new-password" class="form-label">New Password</label>
          <input type="password" id="new-password" class="form-input" placeholder="At least 6 characters" minlength="6" required autocomplete="new-password">
        </div>

        <div class="form-group">
          <label for="confirm-new-password" class="form-label">Confirm New Password</label>
          <input type="password" id="confirm-new-password" class="form-input" placeholder="Repeat new password" minlength="6" required autocomplete="new-password">
        </div>

        <button type="submit" id="btn-submit-reset" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
          Update Password
        </button>
      </form>
    </div>
  </main>

  <script type="module">
    import { getSupabase } from '/js/supabase-client.js';

    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('form-reset');
      const passInput = document.getElementById('new-password');
      const confirmInput = document.getElementById('confirm-new-password');
      const submitBtn = document.getElementById('btn-submit-reset');
      const alertBox = document.getElementById('auth-alert');
      const successBox = document.getElementById('auth-success');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        alertBox.style.display = 'none';
        successBox.style.display = 'none';

        const password = passInput.value;
        const confirm = confirmInput.value;

        if (!password || !confirm) {
          alertBox.textContent = 'Please fill out all fields.';
          alertBox.style.display = 'block';
          return;
        }

        if (password.length < 6) {
          alertBox.textContent = 'Password must be at least 6 characters long.';
          alertBox.style.display = 'block';
          return;
        }

        if (password !== confirm) {
          alertBox.textContent = 'Passwords do not match.';
          alertBox.style.display = 'block';
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Updating...';

        try {
          const supabase = await getSupabase();
          if (!supabase) throw new Error('Supabase client not initialized');

          const { error } = await supabase.auth.updateUser({ password });

          if (error) {
            alertBox.textContent = error.message || 'Failed to update password. Link may be expired.';
            alertBox.style.display = 'block';
            submitBtn.disabled = false;
            submitBtn.textContent = 'Update Password';
            return;
          }

          successBox.innerHTML = `
            <strong>Password Updated!</strong><br>
            Your password has been successfully updated. Redirecting to login...
          `;
          successBox.style.display = 'block';
          form.reset();

          setTimeout(() => {
            window.location.href = '/auth/login.html';
          }, 1500);

        } catch (err) {
          alertBox.textContent = 'An unexpected error occurred.';
          alertBox.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Update Password';
        }
      });
    });
  </script>
</body>
</html>
